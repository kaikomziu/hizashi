name: Release

# v で始まるタグ（例: v1.0.0）を push すると、単一exeをビルドして GitHub Release に添付する
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish (self-contained single file)
        run: >
          dotnet publish Hizashi.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o dist

      - name: Checksum and release notes
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/Hizashi.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Hizashi.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt

          # CHANGELOG.md の該当バージョンの節を取り出す
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $section = ''
          if ($changelog -match "(?s)## \[$([regex]::Escape($ver))\][^\n]*\n(.*?)(?=\n## \[|\z)") { $section = $Matches[1].Trim() }

          @"
          ## ダウンロード
          ``Hizashi.exe`` をダウンロードしてダブルクリックするだけで起動します（インストール不要・.NET の別途インストール不要）。
          Windows 10 / 11 が必要です（WebView2 ランタイムは Windows 11 に標準で入っています）。

          > 「Windows によって PC が保護されました」と表示されたら、「詳細情報」→「実行」で起動できます（署名のない個人開発アプリのため）。

          SHA-256: ``$hash``

          $section
          "@ | Out-File -Encoding utf8 notes.md

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist/Hizashi.exe dist/SHA256SUMS.txt
          --title "Hizashi ${{ github.ref_name }}" --notes-file notes.md
